stages:
  - test
  - package
  - release-verify
  - publish

default:
  image: 'node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd'
  tags:
    - cs_newgen

# Protect the SemVer tag pattern, the npm environment, NPM_TOKEN and
# LOCKER_CLI_RELEASE_PUBLIC_KEY in GitLab project settings.
test:
  stage: test
  parallel:
    matrix:
      - NODE_IMAGE:
          - 'node:22.23.1-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2'
          - 'node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd'
  image: '$NODE_IMAGE'
  script:
    - node scripts/verify-ci-supply-chain.mjs
    - npm ci --ignore-scripts
    - npm audit --audit-level=high
    - npm run format:check
    - npm run typecheck
    - npm test
    - npm pack --dry-run --ignore-scripts
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

package:
  stage: package
  needs:
    - test
  script:
    - node scripts/verify-ci-supply-chain.mjs
    - npm ci --ignore-scripts
    - npm test
    - node -e "require('node:fs').mkdirSync('release-package', { recursive:true })"
    - npm pack --pack-destination release-package
    - >-
      node -e "const fs=require('node:fs'),p=require('./package.json');
      const file='release-package/lockersm-'+p.version+'.tgz';
      if(!fs.statSync(file).isFile())throw new Error('expected npm package is missing')"
  artifacts:
    name: lockersm-js-${CI_COMMIT_SHA}
    paths:
      - release-package/
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

release_verify:
  stage: release-verify
  needs:
    - job: package
      artifacts: true
  script:
    - >-
      node scripts/verify-release.mjs
      --tag "$CI_COMMIT_TAG"
      --artifact "release-package/lockersm-$CI_COMMIT_TAG.tgz"
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/'

publish_npm:
  stage: publish
  interruptible: false
  resource_group: npm
  environment:
    name: npm
    deployment_tier: production
  needs:
    - job: package
      artifacts: true
    - job: release_verify
  script:
    - >-
      node scripts/verify-release.mjs
      --tag "$CI_COMMIT_TAG"
      --artifact "release-package/lockersm-$CI_COMMIT_TAG.tgz"
    - >-
      node -e "const missing=['NPM_TOKEN'].filter((name)=>!process.env[name]);
      if(missing.length){console.error('missing protected CI variable(s): '+missing.join(','));
      process.exit(1)}"
    - npm publish "release-package/lockersm-$CI_COMMIT_TAG.tgz" --access public --ignore-scripts
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/'
      when: manual
      allow_failure: false
